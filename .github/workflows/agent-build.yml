# MILA Agente — build e release do instalador Windows (Tauri/NSIS).
#
# Dois modos:
#  - Tag agent-v* (ex.: agent-v0.2.0): compila, ASSINA a atualização e publica
#    uma GitHub Release com o instalador + latest.json. Os apps instalados
#    se atualizam sozinhos a partir dela (plugin updater).
#  - Run workflow (manual): só compila e deixa o .exe como artifact (teste).
#
# Segredos necessários (Settings > Secrets > Actions):
#  - TAURI_SIGNING_PRIVATE_KEY: conteúdo de ~/.tauri/mila-agent.key
name: MILA Agente — instalador Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'agent-v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Versão do pnpm vem do "packageManager" no package.json da raiz.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/agent/src-tauri

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Gerar ícones do app
        run: pnpm --filter agent exec tauri icon src-tauri/icon-source.png

      # ----- Tag: release assinada com auto-update -----
      - name: Compilar e publicar release (tag)
        if: startsWith(github.ref, 'refs/tags/agent-v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          projectPath: apps/agent
          tagName: ${{ github.ref_name }}
          releaseName: 'MILA Agente ${{ github.ref_name }}'
          releaseBody: 'Instalador do MILA Agente para Windows. Os apps já instalados atualizam sozinhos.'

      # ----- Manual: build de teste, sem release -----
      - name: Compilar (manual, sem release)
        if: ${{ !startsWith(github.ref, 'refs/tags/agent-v') }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: pnpm --filter agent exec tauri build

      - name: Publicar instalador como artifact (manual)
        if: ${{ !startsWith(github.ref, 'refs/tags/agent-v') }}
        uses: actions/upload-artifact@v4
        with:
          name: mila-agente-windows
          path: apps/agent/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
