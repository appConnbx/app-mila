# Compila o instalador Windows do MILA Agente (Tauri/NSIS) na nuvem.
# Dispara manualmente (Actions > MILA Agente > Run workflow) ou por tag agent-v*.
name: MILA Agente — instalador Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'agent-v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Versão do pnpm vem do "packageManager" no package.json da raiz.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/agent/src-tauri

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Gerar ícones do app
        run: pnpm --filter agent exec tauri icon src-tauri/icon-source.png

      - name: Compilar (NSIS)
        run: pnpm --filter agent exec tauri build

      - name: Publicar instalador como artifact
        uses: actions/upload-artifact@v4
        with:
          name: mila-agente-windows
          path: apps/agent/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Anexar à release (apenas em tag)
        if: startsWith(github.ref, 'refs/tags/agent-v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/agent/src-tauri/target/release/bundle/nsis/*.exe
