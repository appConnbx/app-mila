[package]
name = "mila-agent"
version = "0.1.0"
description = "MILA Agente — widget de demandas para desktop"
edition = "2021"

[lib]
name = "mila_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# Pin temporário da família tauri 2.11.1 / tauri-utils 2.9.1: a 2.9.2
# (jun/2026) introduziu um E0119 de coerência (AssetKey × time) que quebra a
# compilação. Travamos o conjunto consistente que compilava. Os crates internos
# (macros/codegen/runtime) precisam ser fixados juntos porque se referenciam com
# `^` e, soltos, puxam a 2.9.2. Reavaliar quando o upstream corrigir.
tauri-build = { version = "=2.6.1", features = [] }
tauri-codegen = "=2.6.1"

[dependencies]
tauri = { version = "=2.11.1", features = ["tray-icon", "image-png"] }
tauri-utils = "=2.9.1"
tauri-macros = "=2.6.1"
tauri-runtime = "=2.11.1"
tauri-runtime-wry = "=2.11.1"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
