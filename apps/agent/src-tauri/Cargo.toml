[package]
name = "mila-agent"
version = "0.1.0"
description = "MILA Agente — widget de demandas para desktop"
edition = "2021"

[lib]
name = "mila_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Build para a Microsoft Store: compila SEM o auto-updater. Na Store, as
# atualizações vêm pela própria loja; um app que baixa/instala código sozinho
# é reprovado na certificação. Use: `tauri build --no-bundle --features store`.
store = []

# Pin temporário (jun/2026): o crate `time` 0.3.48 introduziu uma impl que
# dispara um E0119 de coerência ao compilar `tauri-utils` (assets.rs, AssetKey).
# Travado em time 0.3.47 (último que compilava). Por seguranca, mantemos tambem
# a família tauri na 2.11.1/2.9.1 (conjunto verde); os crates internos
# (macros/codegen/runtime) precisam ser fixados juntos porque se referenciam com
# `^`. Cargo.lock versionado garante reprodutibilidade. Reavaliar quando o
# upstream (time/tauri) corrigir.
[build-dependencies]
tauri-build = { version = "=2.6.1", features = [] }
tauri-codegen = "=2.6.1"

[dependencies]
tauri = { version = "=2.11.1", features = ["tray-icon", "image-png"] }
tauri-utils = "=2.9.1"
tauri-macros = "=2.6.1"
tauri-runtime = "=2.11.1"
tauri-runtime-wry = "=2.11.1"
time = "=0.3.47"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
